<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-UA-compateble" content="IE=<i class="fa fa-edge" aria-hidden="true"></i>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login </title>
      <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <style type="text/css">

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    /* Optional background image to showcase the transparency effect */
    background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
    background-size: cover;
    
    /* Centers the login box perfectly in the middle of the viewport */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Transparent Login Box (Glassmorphism) */
.login-container {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
    backdrop-filter: blur(12px);             /* Creates the frosted glass blur effect */
    -webkit-backdrop-filter: blur(12px);     /* Safari support */
    border: 1px solid rgba(255, 255, 255, 0.3); /* Subtle light border */
    border-radius: 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    color: #ffffff;
}

.login-container h2 {
    text-align: center;
    margin-bottom: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

/* Form Inputs */
.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #f1f1f1;
}

.input-group input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: background 0.3s ease, border-color 0.3s ease;
}

.input-group input::placeholder {
    color: #ddd;
}

.input-group input:focus {
    background: rgba(255, 255, 255, 0.3);
    border-color: #ffffff;
}

/* Options & Links */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 24px;
    color: #f1f1f1;
}

.options a {
    color: #fff;
    text-decoration: none;
    transition: opacity 0.2s;
}

.options a:hover {
    opacity: 0.8;
    text-decoration: underline;
}

/* Submit Button */
.login-btn {
    width: 100%;
    padding: 12px;
    background: rgba(255, 255, 255, 0.85);
    border: none;
    border-radius: 8px;
    color: #333;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.1s ease;
}

.login-btn:hover {
    background: #ffffff;
}

.login-btn:active {
    transform: scale(0.98);
}





      </style>



        <body>

           <div class="login-container">
        <h2>Welcome Back</h2>
        <form>
            <div class="input-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
